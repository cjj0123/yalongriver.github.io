<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅砻江主要水库运行数据实时监测</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; color: #333; }
        h1 { text-align: center; color: #1890ff; margin-bottom: 10px; }
        .update-time { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 30px; }
        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: -12px 0 24px;
        }
        .summary-pill {
            background: #fff;
            border: 1px solid #d9e8ff;
            border-radius: 8px;
            color: #24568f;
            padding: 8px 14px;
            font-size: 0.95em;
            box-shadow: 0 4px 14px rgba(24, 144, 255, 0.08);
        }
        .latest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 28px;
        }
        .latest-card {
            background: #fff;
            border: 1px solid #e8edf5;
            border-radius: 8px;
            padding: 14px 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.04);
        }
        .latest-card h3 { margin: 0 0 8px; color: #1f3b57; font-size: 1.05em; }
        .latest-time { color: #888; font-size: 0.84em; margin-bottom: 10px; }
        .metric-row { display: flex; justify-content: space-between; gap: 10px; line-height: 1.8; font-size: 0.95em; }
        .metric-row span:first-child { color: #666; }
        .metric-row span:last-child { color: #111; font-weight: 600; text-align: right; }
        .latest-source { color: #666; font-size: 0.86em; margin-top: 10px; }
        .latest-source a { color: #1890ff; text-decoration: none; }
        .container { max-width: 1200px; margin: auto; }
        .reservoir-card { 
            background: #fff; 
            border-radius: 12px; 
            margin-bottom: 40px; 
            padding: 30px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.05); 
        }
        .chart-container { height: 650px; width: 100%; }
        .meta-text { color: #666; font-size: 0.92em; margin: -8px 0 14px; text-align: center; }
        .meta-text a { color: #1890ff; text-decoration: none; }
        .loading-text { text-align: center; font-size: 1.1em; color: #666; padding: 100px; }
        .error-text { text-align: center; color: #ff4d4f; padding: 50px; border: 1px dashed #ff4d4f; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>雅砻江主要水库运行数据实时监测</h1>
        <div id="last-sync" class="update-time"></div>
        <div id="data-summary" class="summary-bar"></div>
        <div id="latest-grid" class="latest-grid"></div>
        
        <div id="data-loading" class="loading-text">
            📦 正在同步数据库文件，请稍候...
        </div>
        
        <div id="data-error" class="error-text" style="display: none;"></div>
        
        <div id="charts-area"></div>
    </div>

    <script src="plot.js"></script>
</body>
</html>
